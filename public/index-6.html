<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Hosting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --card2: #1c1c1c;
      --border: #2a2a2a;
      --purple: #7289da;
      --green: #43b581;
      --red: #f04747;
      --orange: #faa61a;
      --text: #ffffff;
      --muted: #666;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }

    /* TOPBAR */
    .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar h1 { font-size: 18px; color: var(--purple); }
    .hamburger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--text); border-radius: 2px; }

    /* DRAWER */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; }
    .drawer-overlay.open { display: block; }
    .drawer { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: var(--card); z-index: 201; transform: translateX(-100%); transition: transform 0.25s ease; padding: 20px 0; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .drawer-header h2 { font-size: 20px; color: var(--purple); }
    .drawer-header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .drawer-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; font-size: 15px; transition: background 0.15s; }
    .drawer-item:hover, .drawer-item.active { background: var(--card2); color: var(--purple); }
    .drawer-item .icon { font-size: 18px; width: 24px; text-align: center; }

    /* PAGES */
    .page { display: none; padding: 20px 16px; }
    .page.active { display: block; }

    /* PROJECTS PAGE */
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .btn-new { background: var(--purple); color: #fff; border: none; border-radius: 10px; padding: 14px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 24px; }

    /* PROJECT CARDS */
    .project-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
    .project-card:hover { border-color: var(--purple); }
    .project-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .project-repo { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
    .running { background: var(--green); color: #fff; }
    .stopped { background: #333; color: #aaa; }
    .error { background: var(--red); color: #fff; }
    .deploying, .starting { background: var(--orange); color: #000; }

    /* ADD FORM */
    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .form-card h3 { font-size: 16px; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select { width: 100%; padding: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--purple); }
    .env-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .env-row input { flex: 1; padding: 10px; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
    .btn-env { background: var(--card2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px; margin-bottom: 16px; }
    .btn-remove-env { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
    .btn-submit { background: var(--purple); color: #fff; border: none; border-radius: 10px; padding: 14px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: var(--card2); color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 14px; width: 100%; font-size: 15px; cursor: pointer; margin-top: 8px; }

    /* PROJECT DETAIL PAGE */
    .back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; margin-bottom: 20px; padding: 0; }
    .detail-header { margin-bottom: 20px; }
    .detail-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .detail-repo { font-size: 13px; color: var(--muted); margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-status { display: inline-flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.stopped { background: #555; }
    .status-dot.error { background: var(--red); }
    .status-dot.deploying, .status-dot.starting { background: var(--orange); }
    .status-text { font-size: 14px; font-weight: 600; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .action-btn { padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s; }
    .action-btn:active { opacity: 0.7; }
    .btn-deploy-d { background: var(--purple); color: #fff; }
    .btn-start-d { background: var(--green); color: #fff; }
    .btn-stop-d { background: #333; color: #aaa; border: 1px solid var(--border); }
    .btn-delete-d { background: var(--red); color: #fff; }

    .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 13px; color: var(--muted); }
    .info-value { font-size: 13px; font-weight: 500; }

    .logs-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .logs-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .logs-header span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-clear-logs { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; }
    .logs-body { padding: 12px; height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; }
    .log-line { padding: 2px 0; }
    .log-line.error { color: var(--red); }
    .log-line.info { color: #aaa; }
    .log-time { color: #444; margin-right: 8px; }
    .empty-logs { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>

<div class="topbar">
  <button class="hamburger" onclick="openDrawer()">
    <span></span><span></span><span></span>
  </button>
  <h1>🌙 Moon Hosting</h1>
  <div style="width:40px"></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>🌙 Moon Hosting</h2>
    <p>Bot Hosting Platform</p>
  </div>
  <div class="drawer-item active" onclick="showPage('projects'); closeDrawer()">
    <span class="icon">📦</span> Projects
  </div>
</div>

<!-- PAGE PROJECTS -->
<div class="page active" id="page-projects">
  <p class="page-title">Projects</p>
  <p class="page-sub">Gérez vos bots Discord</p>
  <button class="btn-new" onclick="showPage('add')">+ Nouveau projet</button>
  <div id="project-list"></div>
</div>

<!-- PAGE ADD -->
<div class="page" id="page-add">
  <button class="back-btn" onclick="showPage('projects')">← Retour</button>
  <div class="form-card">
    <h3>Nouveau projet</h3>
    <div class="field">
      <label>Nom du bot</label>
      <input type="text" id="f-name" placeholder="ex: Mon Bot">
    </div>
    <div class="field">
      <label>URL GitHub</label>
      <input type="text" id="f-repo" placeholder="https://github.com/user/repo">
    </div>
    <div class="field">
      <label>Branch</label>
      <input type="text" id="f-branch" placeholder="main">
    </div>
    <div class="field">
      <label>Fichier principal</label>
      <input type="text" id="f-main" placeholder="index.js">
    </div>
    <div class="field">
      <label>Runtime</label>
      <select id="f-runtime">
        <option value="node">Node.js</option>
        <option value="python">Python</option>
      </select>
    </div>
    <div class="field">
      <label>Variables d'environnement</label>
      <div id="f-env"></div>
      <button class="btn-env" onclick="addEnvRow()">+ Ajouter variable</button>
    </div>
    <button class="btn-submit" onclick="addBot()">Créer le projet</button>
    <button class="btn-cancel" onclick="showPage('projects')">Annuler</button>
  </div>
</div>

<!-- PAGE DETAIL -->
<div class="page" id="page-detail">
  <button class="back-btn" onclick="showPage('projects')">← Projects</button>
  <div class="detail-header">
    <div class="detail-name" id="d-name"></div>
    <div class="detail-repo" id="d-repo"></div>
    <div class="detail-status">
      <div class="status-dot" id="d-dot"></div>
      <span class="status-text" id="d-status"></span>
    </div>
  </div>

  <div class="action-grid">
    <button class="action-btn btn-deploy-d" onclick="deployBot()">🚀 Deploy</button>
    <button class="action-btn btn-start-d" onclick="startBot()">▶ Start</button>
    <button class="action-btn btn-stop-d" onclick="stopBot()">■ Stop</button>
    <button class="action-btn btn-delete-d" onclick="deleteBot()">🗑 Supprimer</button>
  </div>

  <p class="section-title">Informations</p>
  <div class="info-card">
    <div class="info-row"><span class="info-label">Branch</span><span class="info-value" id="d-branch"></span></div>
    <div class="info-row"><span class="info-label">Fichier</span><span class="info-value" id="d-file"></span></div>
    <div class="info-row"><span class="info-label">Runtime</span><span class="info-value" id="d-runtime"></span></div>
  </div>

  <div class="logs-card">
    <div class="logs-header">
      <span>Logs</span>
      <button class="btn-clear-logs" onclick="clearLogs()">Vider</button>
    </div>
    <div class="logs-body" id="d-logs">
      <div class="empty-logs">Aucun log</div>
    </div>
  </div>
</div>

<script>
  let currentBotId = null;
  let logStream = null;
  let allBots = [];

  // DRAWER
  function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

  // PAGES
  function showPage(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    if (p === 'projects') loadProjects();
    if (p === 'detail') loadDetail();
  }

  // ENV ROWS
  function addEnvRow(k='', v='') {
    const row = document.createElement('div');
    row.className = 'env-row';
    row.innerHTML = `<input type="text" placeholder="KEY" value="${k}"><input type="text" placeholder="VALUE" value="${v}"><button class="btn-remove-env" onclick="this.parentNode.remove()">✕</button>`;
    document.getElementById('f-env').appendChild(row);
  }

  // ADD BOT
  async function addBot() {
    const name = document.getElementById('f-name').value.trim();
    const repoUrl = document.getElementById('f-repo').value.trim();
    const branch = document.getElementById('f-branch').value.trim() || 'main';
    const mainFile = document.getElementById('f-main').value.trim() || 'index.js';
    const runtime = document.getElementById('f-runtime').value;
    if (!name || !repoUrl) return alert('Nom et URL GitHub requis');
    const env = {};
    document.querySelectorAll('#f-env .env-row').forEach(row => {
      const [k, v] = row.querySelectorAll('input');
      if (k.value.trim()) env[k.value.trim()] = v.value;
    });
    await fetch('/api/bots', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, repoUrl, branch, mainFile, runtime, env }) });
    document.getElementById('f-name').value = '';
    document.getElementById('f-repo').value = '';
    document.getElementById('f-branch').value = '';
    document.getElementById('f-main').value = '';
    document.getElementById('f-env').innerHTML = '';
    showPage('projects');
  }

  // LOAD PROJECTS
  async function loadProjects() {
    const res = await fetch('/api/bots');
    allBots = await res.json();
    const list = document.getElementById('project-list');
    if (allBots.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:60px 0">Aucun projet — crée le premier !</div>';
      return;
    }
    list.innerHTML = allBots.map(bot => `
      <div class="project-card" onclick="openBot('${bot.id}')">
        <div class="project-card-top">
          <div>
            <div class="project-name">${bot.name}</div>
            <div class="project-repo">${bot.repoUrl}</div>
          </div>
          <span class="status-pill ${bot.status}">${bot.status}</span>
        </div>
      </div>`).join('');
  }

  // OPEN BOT DETAIL
  function openBot(id) {
    currentBotId = id;
    if (logStream) { logStream.close(); logStream = null; }
    showPage('detail');
  }

  // LOAD DETAIL
  async function loadDetail() {
    if (!currentBotId) return;
    const res = await fetch('/api/bots');
    const bots = await res.json();
    const bot = bots.find(b => b.id === currentBotId);
    if (!bot) return showPage('projects');

    document.getElementById('d-name').textContent = bot.name;
    document.getElementById('d-repo').textContent = bot.repoUrl;
    document.getElementById('d-branch').textContent = bot.branch || 'main';
    document.getElementById('d-file').textContent = bot.mainFile || 'index.js';
    document.getElementById('d-runtime').textContent = bot.runtime || 'node';

    const dot = document.getElementById('d-dot');
    const statusEl = document.getElementById('d-status');
    dot.className = 'status-dot ' + bot.status;
    statusEl.textContent = bot.status;

    // Load logs
    const logsRes = await fetch(`/api/bots/${currentBotId}/logs`);
    const logs = await logsRes.json();
    renderLogs(logs);

    // Stream
    if (logStream) logStream.close();
    logStream = new EventSource(`/api/bots/${currentBotId}/logs/stream`);
    logStream.onmessage = (e) => {
      const line = JSON.parse(e.data);
      appendLog(line);
    };
  }

  function renderLogs(logs) {
    const box = document.getElementById('d-logs');
    if (logs.length === 0) { box.innerHTML = '<div class="empty-logs">Aucun log</div>'; return; }
    box.innerHTML = logs.map(l => `<div class="log-line ${l.level}"><span class="log-time">${new Date(l.ts).toLocaleTimeString()}</span>${escHtml(l.text)}</div>`).join('');
    box.scrollTop = box.scrollHeight;
  }

  function appendLog(line) {
    const box = document.getElementById('d-logs');
    const empty = box.querySelector('.empty-logs');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'log-line ' + line.level;
    div.innerHTML = `<span class="log-time">${new Date(line.ts).toLocaleTimeString()}</span>${escHtml(line.text)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function clearLogs() { document.getElementById('d-logs').innerHTML = '<div class="empty-logs">Aucun log</div>'; }
  function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ACTIONS
  async function deployBot() {
    await fetch(`/api/bots/${currentBotId}/deploy`, { method: 'POST' });
    document.getElementById('d-status').textContent = 'deploying';
    document.getElementById('d-dot').className = 'status-dot deploying';
  }

  async function startBot() {
    await fetch(`/api/bots/${currentBotId}/start`, { method: 'POST' });
    setTimeout(loadDetail, 1000);
  }

  async function stopBot() {
    await fetch(`/api/bots/${currentBotId}/stop`, { method: 'POST' });
    setTimeout(loadDetail, 500);
  }

  async function deleteBot() {
    if (!confirm('Supprimer ce bot définitivement ?')) return;
    await fetch(`/api/bots/${currentBotId}`, { method: 'DELETE' });
    currentBotId = null;
    showPage('projects');
  }

  // INIT
  loadProjects();
  setInterval(() => {
    const active = document.querySelector('.page.active');
    if (active?.id === 'page-projects') loadProjects();
    if (active?.id === 'page-detail') {
      fetch(`/api/bots/${currentBotId}/status`).then(r => r.json()).then(s => {
        document.getElementById('d-dot').className = 'status-dot ' + s.status;
        document.getElementById('d-status').textContent = s.status;
      });
    }
  }, 4000);
</script>
</body>
</html>
