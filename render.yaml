services:
  - type: web
    name: bothost-api
    runtime: node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data/bothost
      - key: ALLOWED_ORIGINS
        sync: false   # à remplir avec l'URL de ton dashboard artifact
      - key: API_SECRET
        generateValue: true   # clé pour sécuriser l'API
    disk:
      name: bothost-data
      mountPath: /var/data/bothost
      sizeGB: 1
