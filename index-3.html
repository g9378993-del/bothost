<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Hosting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #7289da; }
    .add-form { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    .add-form input, .add-form input[type=file] {
      width: 100%; padding: 10px; margin: 8px 0;
      background: #2a2a2a; border: 1px solid #333; border-radius: 6px; color: #fff;
    }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #7289da; color: #fff; width: 100%; margin-top: 10px; }
    .btn-start { background: #43b581; color: #fff; }
    .btn-stop { background: #f04747; color: #fff; }
    .btn-delete { background: #333; color: #fff; }
    .bot-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .bot-info h3 { margin-bottom: 5px; }
    .status { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
    .running { background: #43b581; }
    .stopped { background: #f04747; }
    .actions { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <h1>🌙 Moon Hosting</h1>

  <div class="add-form">
    <h2 style="margin-bottom:15px">Ajouter un bot</h2>
    <input type="text" id="botName" placeholder="Nom du bot">
    <input type="text" id="botToken" placeholder="Token Discord">
    <input type="file" id="botFile" accept=".js">
    <button class="btn btn-primary" onclick="addBot()">Ajouter</button>
  </div>

  <div id="botList"></div>

  <script>
    async function loadBots() {
      const res = await fetch('/api/bots');
      const bots = await res.json();
      const list = document.getElementById('botList');
      list.innerHTML = '';
      bots.forEach(bot => {
        list.innerHTML += `
          <div class="bot-card">
            <div class="bot-info">
              <h3>${bot.name}</h3>
              <span class="status ${bot.status}">${bot.status}</span>
            </div>
            <div class="actions">
              <button class="btn btn-start" onclick="startBot(${bot.id})">▶</button>
              <button class="btn btn-stop" onclick="stopBot(${bot.id})">■</button>
              <button class="btn btn-delete" onclick="deleteBot(${bot.id})">🗑</button>
            </div>
          </div>`;
      });
    }

    async function addBot() {
      const name = document.getElementById('botName').value;
      const token = document.getElementById('botToken').value;
      const file = document.getElementById('botFile').files[0];
      if (!name || !token || !file) return alert('Remplis tout');
      const form = new FormData();
      form.append('name', name);
      form.append('token', token);
      form.append('file', file);
      await fetch('/api/bots', { method: 'POST', body: form });
      loadBots();
    }

    async function startBot(id) {
      await fetch(`/api/bots/${id}/start`, { method: 'POST' });
      loadBots();
    }

    async function stopBot(id) {
      await fetch(`/api/bots/${id}/stop`, { method: 'POST' });
      loadBots();
    }

    async function deleteBot(id) {
      await fetch(`/api/bots/${id}`, { method: 'DELETE' });
      loadBots();
    }

    loadBots();
    setInterval(loadBots, 5000);
  </script>
</body>
</html>
